<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a120c">
  <title>Prova realistica · Valmora</title>
  <script type="importmap">
  { "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120c; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
      padding: 10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
      font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f6e7d3;
      background: linear-gradient(to top, rgba(20,12,6,.72), rgba(20,12,6,0)); pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #title { flex: 1; min-width: 0; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bar { position: fixed; top: 0; left: 0; height: 3px; background: #f0b46a; width: 0; z-index: 3; }
    button { font: inherit; color: #2a1708; background: #f3c98f; border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
    a { color: #f3c98f; }
    #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f6e7d3;
      font: 15px system-ui, -apple-system, sans-serif; z-index: 4; background: #1a120c; transition: opacity .8s; }
    #credits { position: fixed; inset: 0; z-index: 5; display: none; background: rgba(20,12,6,.92); color: #f6e7d3; overflow: auto;
      padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      font: 14px/1.5 system-ui, -apple-system, sans-serif; }
    #credits pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="load">Carico la scena…</div>
  <div id="ui">
    <div id="title">Una sera sul divano · prova realistica</div>
    <a href="#" id="credlink">Crediti</a>
    <button id="replay">Rigioca</button>
  </div>
  <div id="credits"><button id="credclose">Chiudi</button><pre id="credtext"></pre></div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
