<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd8ff">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Valmora">
  <meta name="application-name" content="Leggende di Valmora">
  <meta name="description" content="Un gioco di avventura e cattura di creature nell'arcipelago di Valmora.">
  <title>Leggende di Valmora</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/sheets.css">
  <link rel="stylesheet" href="css/battle.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd8ff; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100;
      background: radial-gradient(120% 90% at 50% 40%, #fff3d6 0%, #ffd27a 45%, #ff9a6b 100%); color: #5a2d1a;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
    #boot .title { font-size: clamp(34px, 9vw, 64px); font-weight: 900; text-align: center; line-height: 1; color: #fff;
      text-shadow: 0 3px 0 #c24a2a, 0 -3px 0 #c24a2a, 3px 0 0 #c24a2a, -3px 0 0 #c24a2a, 0 7px 0 #7a2a17; }
    #boot .ball { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #3a2140; background: linear-gradient(#ff5f5f 46%, #3a2140 46% 54%, #fff 54%);
      animation: wob 1.2s ease-in-out infinite; }
    #boot .sub { font-size: 15px; font-weight: 700; opacity: .8; min-height: 1.2em; }
    @keyframes wob { 0%, 100% { transform: rotate(-14deg) } 50% { transform: rotate(14deg) } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="boot"><div class="title">Leggende<br>di Valmora</div><div class="ball"></div><div class="sub" id="boot-msg"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
